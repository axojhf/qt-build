  static-66-mingw64-dev:
    name: Static Qt 6.11 llvm mingw Build
    runs-on: windows-latest
    steps:
      - name: Prepare llvm-mingw ninja ffmpeg
        run: |
          (new-object System.Net.WebClient).DownloadFile('https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-win.zip','ninja-win.zip')
          7z x -aoa -oC:\ninja ninja-win.zip ; rm ninja-win.zip
          (new-object System.Net.WebClient).DownloadFile('https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip','ffmpeg-master-latest-win64-gpl-shared.zip')
          7z x -aoa -oC:\ ffmpeg-master-latest-win64-gpl-shared.zip ; ren C:\ffmpeg-master-latest-win64-gpl-shared ffmpeg ; rm ffmpeg-master-latest-win64-gpl-shared.zip
          (new-object System.Net.WebClient).DownloadFile('https://github.com/mstorsjo/llvm-mingw/releases/download/20260210/llvm-mingw-20260210-ucrt-x86_64.zip','llvm-mingw-20260210-ucrt-x86_64.zip')
          7z x -aoa -oC:\ llvm-mingw-20260210-ucrt-x86_64.zip ; rm llvm-mingw-20260210-ucrt-x86_64.zip ; ren C:\llvm-mingw-20260210-ucrt-x86_64 llvm
          rm "C:\llvm\x86_64-w64-mingw32\lib\*.dll.a" -Recurse
      - name: Build Qt6
        run: |
          $Env:PATH = "C:\llvm\bin;C:\ninja;C:\ffmpeg\include;C:\ffmpeg\lib;C:\ffmpeg\bin;C:\openssl-3\x64\lib;C:\openssl-3\x64\include;$Env:PATH"
          cd C:/ ; git clone --depth=1 https://code.qt.io/qt/qt5.git -b 6.11 qt6 ; cd qt6
          .\init-repository.bat --module-subset=qt5compat,qt3d,qtbase,qtcharts,qtdeclarative,qtimageformats,qtquicktimeline,qtquick3d,qtshadertools,qtsvg,qtmultimedia,qtcanvaspainter
          ./configure.bat -release -static -platform win32-clang-g++ -prefix "C:\QtStatic" -confirm-license -nomake examples -nomake tests -schannel -qt-zlib -qt-libjpeg -qt-libpng -qt-freetype -qt-pcre -qt-harfbuzz -qt-sqlite -no-sql-psql -no-sql-mysql -qt-tiff -qt-webp
          cmake --build . --parallel
          cmake --install .
      - name: Package Qt
        run: |
          7z a qt6.11_llvm_mingw64_static.7z C:\QtStatic
      - name: Update Static Qt llvm mingw Build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: qt-static
          files: |
            qt6.11_llvm_mingw64_static.7z

